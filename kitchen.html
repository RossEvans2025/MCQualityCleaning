<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MC Quality Cleaning Services</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #030303;
      --charcoal: #10080d;
      --pink: #f05a9d;
      --rose: #ff9ac8;
      --gold: #d7a84f;
      --soft-gold: #f7d98d;
      --cream: #fff7ed;
      --white: #ffffff;
      --blush: #ffe1ef;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Montserrat", sans-serif;
      background: linear-gradient(180deg, var(--cream), var(--blush));
      color: var(--black);
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    /* NAV */

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 999;
      background: #000;
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }

    .nav-wrap {
      min-height: 86px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand img {
      width: 120px;
      display: block;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-menu a {
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      transition: .25s;
    }

    .nav-menu a:hover {
      color: var(--rose);
    }

    /* HERO */

    .hero-gallery {
      padding: 90px 0;
      text-align: center;
      color: var(--white);

      background:
        radial-gradient(circle at 20% 20%, rgba(240,90,157,.28), transparent 26%),
        radial-gradient(circle at 80% 40%, rgba(216,168,79,.25), transparent 28%),
        linear-gradient(135deg, #020202, #160812, #050505);

      border-bottom: 4px solid var(--gold);
    }

    .script-line {
      font-family: "Great Vibes", cursive;
      color: var(--soft-gold);
      font-size: clamp(2.2rem, 5vw, 4rem);
      margin-bottom: 10px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 7vw, 6rem);
      line-height: .95;
    }

    /* GALLERY */

    .gallery-page {
      padding: 70px 0;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .gallery-box {
      overflow: hidden;
      border-radius: 28px;
      border: 2px solid var(--gold);
      box-shadow: 0 16px 35px rgba(0,0,0,.18);
      background: #000;
      transition: transform .25s;
    }

    .gallery-box:hover {
      transform: translateY(-4px);
    }

    .gallery-box img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
      transition: transform .4s ease;
    }

    .contain-image img {
      object-fit: contain;
      background: #000;
    }

    .gallery-box:hover img {
      transform: scale(1.05);
    }

    /* FOOTER */

    .footer {
      background: #000;
      color: var(--white);
      padding: 40px 0;
      text-align: center;
      border-top: 3px solid var(--pink);
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-box img {
        height: 260px;
      }

      .nav-menu {
        gap: 12px;
        font-size: .9rem;
      }

    }

  </style>
</head>

<body>

<header class="top-bar">
  <div class="container nav-wrap">

    <a href="index.html" class="brand">
      <img src="assets/mc-logo.JPEG" alt="MC Quality Cleaning Logo">
    </a>

    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery Hub</a>
      <a href="bathroom.html">Bathroom</a>
      <a href="office.html">Office</a>
    </nav>

  </div>
</header>

<section class="hero-gallery">
  <div class="container">
    <p class="script-line">MC Quality Cleaning</p>
    <h1>Kitchen Gallery</h1>
  </div>
</section>

<section class="gallery-page">
  <div class="container">

    <div class="gallery-grid">

      <div class="gallery-box">
        <img src="assets/IMG_0409.jpeg" alt="Kitchen Cleaning">
      </div>

      <div class="gallery-box">
        <img src="assets/kitchen/kitchen_2.JPEG" alt="Kitchen Cleaning">
      </div>

      <div class="gallery-box">
        <img src="assets/kitchen/kitchen_4.JPEG" alt="Kitchen Cleaning">
      </div>

      <div class="gallery-box">
        <img src="assets/kitchen/kitchen_5.JPEG" alt="Kitchen Cleaning">
      </div>

      <div class="gallery-box contain-image">
        <img src="assets/kitchen/stove.JPEG" alt="Kitchen Stove Cleaning">
      </div>

    </div>

  </div>
</section>

<footer class="footer">
  <p>MC Quality Cleaning Services | Where clean meets perfection.</p>
</footer>

</body>
</html>
